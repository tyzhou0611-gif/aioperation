# =============================================================================
# 开发环境配置（默认）
# =============================================================================
spring:
  datasource:
    url: jdbc:h2:file:./data/aiops;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.aiops: DEBUG
    org.springframework.security: DEBUG