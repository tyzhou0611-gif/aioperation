version: '3.8'

# =============================================================================
# AI-Ops Platform - 可选外接监控组件
# 此文件非必需，仅当用户需要外接 Prometheus + Grafana 监控链路时使用
# 启动方式：docker-compose -f optional-docker-compose.yml up -d
# 注意：需要先在 host 上安装 node_exporter 或在目标服务器上暴露指标
# =============================================================================

services:

  # ===== Prometheus（时序数据库 + 抓取器） =====
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: aiops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  # ===== Grafana（可视化看板） =====
  grafana:
    image: grafana/grafana:10.4.2
    container_name: aiops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data: