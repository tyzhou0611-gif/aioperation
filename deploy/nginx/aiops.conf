# =============================================================================
# AI-Ops Platform 前端静态站点 + 后端 API 反向代理
#
# 部署方式（推荐：前后端同源，无 CORS）：
#   1. 解压 aiops-frontend-<version>.tar.gz 到 /usr/share/nginx/html/aiops
#   2. 本文件放到 /etc/nginx/conf.d/aiops.conf，按需修改 root 与 server_name
#   3. nginx -t && nginx -s reload
#
# 如前后端分属不同域名/端口，则不用本代理，改为前端构建时设置
# VITE_API_BASE_URL，并在后端配置 app.cors.allowed-origin-patterns。
# =============================================================================

server {
    listen       80;
    server_name  _;

    charset utf-8;
    client_max_body_size 50m;

    root  /usr/share/nginx/html/aiops;
    index index.html;

    # ---- Vue History 路由：刷新子路由不 404 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 带 hash 的静态资源长期缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- 后端 API（保留 /api 前缀）----
    location /api/ {
        proxy_pass         http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        # AI 对话等流式响应不缓冲
        proxy_buffering off;
    }

    # ---- 命令执行 WebSocket ----
    location /ws/ {
        proxy_pass         http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ---- H2 控制台 / Actuator（按需开放，生产建议关闭）----
    # location /h2-console/ {
    #     proxy_pass http://127.0.0.1:8181;
    #     proxy_set_header Host $host;
    # }
    # location /actuator/ {
    #     proxy_pass http://127.0.0.1:8181;
    #     proxy_set_header Host $host;
    # }

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}